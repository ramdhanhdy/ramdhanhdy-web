<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Apply the stored theme before first paint so the page never flashes dark.
      try {
        var theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.setAttribute(
            'content',
            theme === 'light' ? '#F5F4F0' : '#000000'
          );
        }
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <title>Ramdhan Hidayat — Data & AI Engineer</title>
    <meta
      name="description"
      content="Data analyst and AI engineer working on retail analytics, AI agents, computer vision, and algorithmic trading. Has briefed DPR RI on social program outcomes."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ramdhan Hidayat",
        "jobTitle": "Data Analyst & AI Engineer",
        "url": "https://github.com/ramdhanhdy",
        "knowsAbout": [
          "Data Analytics",
          "AI Engineering",
          "Computer Vision",
          "Algorithmic Trading",
          "Causal Inference"
        ]
      }
    </script>
  </head>

  </body>
</html>
